[project]
name = "greenpatch"
version = "0.1.0"
description = "AI-assisted greenscreen repair for reflective/damaged regions."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
authors = [{ name = "GreenPatch Authors" }]
keywords = ["video", "greenscreen", "repair", "tracking", "opencv"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Video",
]
dependencies = [
    "numpy>=1.26",
    "opencv-python>=4.9",
    "typer>=0.12",
    "rich>=13.7",
    "pillow>=10.4",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
ai = [
    "onnxruntime>=1.17",
    "torch>=2.2",
    "torchvision>=0.17",
]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "black>=24.4",
    "mypy>=1.9",
]

[project.scripts]
greenpatch = "greenpatch.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
